## Dependency Versions

# 3.25.9 is the latest 25.x patch and the exact protobuf-java that grpc-protobuf 1.84.1 declares; the
# protobuf-bom import previously forced it back down to 3.25.5. Staying on 25.x rather than the 4.36.2 the
# Spring Boot 4 BOM selects: this property also picks the protoc compiler for genie-proto, so moving to 4.x
# is a gencode change across the Java 8 / Boot 2 modules, not a version bump.
protobuf_version=3.25.9
# Matches <grpc-java.version> in spring-boot-dependencies:4.1.2, which is also the gRPC line paired with
# netty 4.2.19.Final. Drives both the io.grpc:grpc-bom import and the protoc-gen-grpc-java codegen plugin in
# genie-proto, so runtime and generated stubs stay on one version. Keep the explicit grpc-bom import: the
# Spring Boot 2 BOM manages no io.grpc artifacts, so genie-proto has no other version source.
grpc_version=1.84.1
netty_version=4.2.19.Final
spring_boot_2_version=2.7.18
spring_cloud_2_version=2021.0.2
spring_cloud_aws_2_version=2.4.4

# https://github.com/awspring/spring-cloud-aws?tab=readme-ov-file#compatibility-with-spring-project-versions
spring_boot_4_version=4.1.2
spring_cloud_4_version=2025.1.4
spring_cloud_aws_4_version=4.0.2

## Override Spring Dependency Managed Versions

## Gradle Property Overrides

# org.gradle.parallel=true

# Several modules (genie-client, genie-common, genie-common-external, genie-proto,
# genie-test) still target a Java 8 toolchain. actions/setup-java installs JDKs into
# the runner tool cache and only points JAVA_HOME at the last version requested, so
# the remaining ones are discoverable only through these variables. Unset variables
# are ignored, so this is a no-op for local builds.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64

## Ensure release candidates are published to JCenter/Maven Central
netflixossPublishCandidatesToMavenCentral=true

org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
